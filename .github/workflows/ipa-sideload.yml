name: Build IPA for sideloading

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Select required Xcode
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          developer_dir="/Applications/Xcode_${version}.app/Contents/Developer"
          test -d "$developer_dir"
          sudo xcode-select --switch "$developer_dir"
          xcodebuild -version
          df -h .

      - name: Prepare build-only signing profiles
        run: |
          python3 build-system/prepare-sideload-profiles.py
          python3 build-system/Make/ImportCertificates.py --path build/sideload-codesigning/certs

      - name: Test privacy policy
        run: |
          xcrun swiftc submodules/TelegramCore/Sources/Network/SideloadPrivacy.swift \
            build-system/tests/SideloadPrivacyTests.swift -o /tmp/sideload-privacy-tests
          /tmp/sideload-privacy-tests
          xcrun swiftc submodules/TelegramCore/Sources/TelegramEngine/Messages/LocalMessageHistoryEntry.swift \
            build-system/tests/LocalMessageHistoryTests.swift -o /tmp/local-history-tests
          /tmp/local-history-tests
          python3 -m unittest discover -s build-system/tests -p 'test_*.py'


      - name: Prepare private API configuration
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: python3 build-system/prepare-sideload-configuration.py

      - name: Test message retention and real API privacy routes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          python3 -u build-system/Make/Make.py \
            test \
            --configurationPath=build/private-sideload-configuration.json \
            --codesigningInformationPath=build/sideload-codesigning \
            --target=//submodules/TelegramCore:PersonalForkTests \
            2>&1 | tee build/build.log

      - name: Build device IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/artifacts
          python3 -u build-system/Make/Make.py \
            build \
            --continueOnError \
            --configurationPath=build/private-sideload-configuration.json \
            --codesigningInformationPath=build/sideload-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$((100000 + GITHUB_RUN_NUMBER))" \
            2>&1 | tee -a build/build.log
          test -s bazel-bin/Telegram/Telegram.ipa
          cp bazel-bin/Telegram/Telegram.ipa build/artifacts/Telegram.ipa
          unzip -tq build/artifacts/Telegram.ipa
          python3 build-system/verify-personal-ipa.py build/artifacts/Telegram.ipa \
            --expected-build="$((100000 + GITHUB_RUN_NUMBER))"

      - name: Collect debug symbols
        if: success()
        run: |
          mkdir -p build/dsyms
          for path in bazel-bin/Telegram/*.dSYM; do
            if [ -d "$path" ]; then cp -R "$path" build/dsyms/; fi
          done
          if [ -n "$(ls -A build/dsyms)" ]; then
            ditto -c -k --keepParent build/dsyms build/artifacts/Telegram-dSYMs.zip
          fi

      - name: Encrypt private build artifacts
        env:
          TELEGRAM_ARTIFACT_PASSWORD: ${{ secrets.TELEGRAM_ARTIFACT_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_ARTIFACT_PASSWORD"
          xcrun swiftc build-system/encrypt-sideload-artifact.swift -o /tmp/encrypt-sideload-artifact
          for path in build/artifacts/Telegram.ipa build/artifacts/Telegram-dSYMs.zip; do
            if [ -f "$path" ]; then
              /tmp/encrypt-sideload-artifact "$path"
              rm "$path"
            fi
          done

      - name: Sanitize build log and remove private configuration
        if: always()
        env:
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          path = Path('build/build.log')
          secret = os.environ.get('TELEGRAM_API_HASH', '')
          if path.exists() and secret:
              path.write_text(path.read_text(errors='replace').replace(secret, '[REDACTED]'))
          Path('build/private-sideload-configuration.json').unlink(missing_ok=True)
          # A failed test must not leave an unencrypted private IPA on the runner.
          for artifact in ('Telegram.ipa', 'Telegram-dSYMs.zip'):
              Path('build/artifacts', artifact).unlink(missing_ok=True)
          PYCODE

      - name: Upload IPA (requires re-signing before installation)
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-IPA-sideload
          path: build/artifacts/Telegram.ipa.enc
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-debug-symbols
          path: build/artifacts/Telegram-dSYMs.zip.enc
          if-no-files-found: ignore
          retention-days: 7
